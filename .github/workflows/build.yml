name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.generator }} ${{ matrix.config }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        generator: [ "Visual Studio 18 2026", "Ninja Multi-Config" ]
        config: [ Debug, Final ]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        lfs: true

    - name: Install CMake 4.5
      uses: lukka/get-cmake@v4.5.0
      with:
        cmakeVersion: "~4.5.0"

    # Ninja doesn't set up the MSVC environment itself, the Visual Studio generator does.
    - name: Set up MSVC environment
      if: matrix.generator == 'Ninja Multi-Config'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake (Visual Studio)
      if: matrix.generator != 'Ninja Multi-Config'
      run: cmake -B ${{ github.workspace }}/build -G "${{ matrix.generator }}" -A x64

    - name: Configure CMake (Ninja)
      if: matrix.generator == 'Ninja Multi-Config'
      run: cmake -B ${{ github.workspace }}/build -G "${{ matrix.generator }}" -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.config }}

    - name: Test
      run: ctest --test-dir ${{ github.workspace }}/build -C ${{ matrix.config }} --output-on-failure
