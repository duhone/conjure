name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: ${{ matrix.config }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Final ]

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        lfs: true

    - name: Install CMake 4.5
      uses: lukka/get-cmake@v4.5.0
      with:
        cmakeVersion: "~4.5.0"

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.config }}

    - name: Test
      run: ctest --test-dir ${{ github.workspace }}/build -C ${{ matrix.config }} --output-on-failure
